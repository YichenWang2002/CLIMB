# Waypoints for the `hospital` dataset domain, mapped onto the
# aws-robomaker-hospital-world-ros2 Gazebo world.
#
# !!! PLACEHOLDER COORDINATES !!!
# These x/y/yaw values are hand-picked approximations and were NOT calibrated
# against the actual AWS world on a live system. You MUST jog a robot (or use
# rviz "Publish Point") in your own Gazebo instance and replace every entry
# before relying on navigation.
#
# Location ids come from mBT/pipeline/datagen/strips/domains.py (hospital).
# Frame: "map". yaw in radians.

waypoints:
  charge_nook:     {x: 0.0, y: 0.0,  yaw: 0.0}
  lab:             {x: 2.0, y: 1.0,  yaw: 0.0}
  pharmacy:        {x: 4.0, y: 0.5,  yaw: 1.57}
  nurses_station:  {x: 2.0, y: -2.0, yaw: 0.0}
  ward_east:       {x: 6.0, y: -3.0, yaw: 1.57}
  ward_west:       {x: 0.0, y: -4.0, yaw: -1.57}
